<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？｜隨機美食轉盤</title>
<style>
:root{--orange:#f97316;--yellow:#fbbf24;--cream:#fff7ed;--ink:#374151;--muted:#7c6b5d;--line:#fed7aa;--white:#fff;--shadow:0 12px 35px #9a34121a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#ffedd5 0%,var(--cream) 46%,#fffbf5 100%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}header{text-align:center;padding:38px 12px 15px}h1{margin:0;font-size:clamp(2rem,6vw,3rem);color:#c2410c;letter-spacing:.03em}header p{color:#9a5d35;margin:9px 0 0}.container{width:min(1100px,94%);margin:0 auto 40px}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:20px;align-items:start}.card{background:#fffffff2;border:1px solid #ffedd5;box-shadow:var(--shadow);border-radius:22px;padding:24px;margin-bottom:20px}.card h2{font-size:1.15rem;margin:0 0 16px;color:#9a3412}.wheel-card{text-align:center}.wheel-stage{position:relative;max-width:470px;margin:8px auto 0;padding-top:12px}canvas{display:block;width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(0 12px 12px #9a34122b)}.pointer{position:absolute;z-index:2;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:33px solid #dc2626;filter:drop-shadow(0 2px 2px #7f1d1d55)}.primary{border:0;background:linear-gradient(135deg,#fb923c,#f97316);color:white;font-weight:800;border-radius:15px;padding:14px 22px;box-shadow:0 7px 14px #fb923c55}.primary:hover:not(:disabled){filter:brightness(1.04)}.spin{font-size:1.1rem;min-width:205px;margin:18px auto 4px}.result{min-height:53px;font-size:1.3rem;font-weight:800;color:#c2410c;padding:10px 0}.hint{font-size:.88rem;color:var(--muted);margin:5px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;text-align:left;gap:6px;font-size:.9rem;font-weight:700;color:#754c30}input,select{width:100%;min-width:0;border:1px solid #fdba74;background:#fffdfa;border-radius:11px;padding:11px 12px;color:var(--ink)}input:focus,select:focus{outline:2px solid #fdba74;outline-offset:1px}.full{grid-column:1/-1}.secondary{border:1px solid #fdba74;border-radius:10px;background:#fff7ed;color:#9a3412;padding:9px 13px;font-weight:700}.danger{border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:10px;padding:8px 11px}.small{font-size:.84rem}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.food-list{display:grid;gap:9px;max-height:390px;overflow:auto}.food-item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #ffedd5;border-radius:12px;padding:10px 12px;background:#fffcf8}.food-name{font-weight:750;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.8rem;margin-top:3px}.actions{display:flex;gap:5px;flex-shrink:0}.actions button{padding:7px 9px}.history-list{padding-left:22px;margin:0;display:grid;gap:9px}.history-list li{padding:5px;color:#854d0e}.history-list time{font-size:.8rem;color:var(--muted);margin-left:8px}.empty{color:var(--muted);padding:15px 0;text-align:center}.footer{text-align:center;color:#ad7a56;font-size:.8rem;padding:10px 0 35px}.count{font-size:.84rem;color:#9a3412;background:#ffedd5;border-radius:100px;padding:5px 10px}#notice{color:#b45309;min-height:21px;font-size:.9rem;margin-top:10px}.wide{width:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}.card{padding:18px}header{padding-top:24px}.wheel-stage{max-width:400px}}@media(max-width:430px){.form-grid{grid-template-columns:1fr}.food-item{align-items:flex-start}.actions{flex-direction:column}.card{border-radius:16px}.wheel-stage{max-width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><h1>🍔 今天吃什麼？</h1><p>不知道吃什麼？讓命運幫你決定！</p></header>
<main class="container"><div class="layout"><section>
<div class="card wheel-card"><h2>🎡 美食幸運轉盤</h2><div class="wheel-stage"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="800" height="800" role="img" aria-label="美食轉盤，指針位於正上方"></canvas></div><button id="spinBtn" class="primary spin">🎲 開始抽選！</button><div id="result" class="result" role="status" aria-live="polite"></div><p id="notice" role="status" aria-live="polite"></p></div>
<div class="card"><h2>🔎 篩選條件</h2><div class="form-grid"><label class="field">料理分類<select id="filterCategory"><option value="全部">全部</option><option>中式</option><option>日式</option><option>韓式</option><option>西式</option><option>其他</option></select></label><label class="field">最高預算（NT$，留空不限）<input id="filterBudget" type="number" min="0" step="1" placeholder="例如：200" inputmode="numeric"></label></div><div class="row" style="margin-top:13px"><span id="foodCount" class="count"></span><button id="resetFilters" class="secondary small">清除篩選</button></div></div>
</section><section>
<div class="card"><h2 id="formTitle">➕ 新增美食</h2><form id="foodForm" class="form-grid"><label class="field full">食物名稱<input id="foodName" maxlength="28" placeholder="例如：雞排" required></label><label class="field">料理分類<select id="foodCategory"><option>中式</option><option>日式</option><option>韓式</option><option>西式</option><option>其他</option></select></label><label class="field">預估價格（NT$）<input id="foodPrice" type="number" min="0" step="1" placeholder="例如：90" required></label><div class="full row"><button id="submitFood" type="submit" class="primary">新增到轉盤</button><button id="cancelEdit" type="button" class="secondary" hidden>取消編輯</button></div></form></div>
<div class="card"><div class="row" style="margin-bottom:14px"><h2 style="margin:0">🍜 我的美食清單</h2><span id="totalCount" class="count"></span></div><div id="foodList" class="food-list"></div></div>
<div class="card"><div class="row" style="margin-bottom:14px"><h2 style="margin:0">🕒 最近抽選紀錄</h2><button id="clearHistory" class="secondary small">清除紀錄</button></div><div id="history"></div></div>
</section></div></main><footer class="footer">Made with ❤️ & Vibe Coding · 資料僅儲存在此瀏覽器</footer>
<script>
(()=>{'use strict';
const KEY='foodWheel_v1_foods',HISTORY_KEY='foodWheel_v1_history',FILTER_KEY='foodWheel_v1_filters';
const DEFAULT_FOODS=[{name:'火鍋',category:'中式',price:250},{name:'牛肉麵',category:'中式',price:150},{name:'便當',category:'中式',price:100},{name:'拉麵',category:'日式',price:220},{name:'壽司',category:'日式',price:200},{name:'韓式拌飯',category:'韓式',price:180},{name:'漢堡',category:'西式',price:150},{name:'義大利麵',category:'西式',price:230}];
const CATEGORIES=['中式','日式','韓式','西式','其他'],COLORS=['#fb923c','#fbbf24','#fdba74','#6ee7b7','#93c5fd','#f9a8d4','#c4b5fd','#fca5a5','#a7f3d0','#fcd34d'];
const $=id=>document.getElementById(id);let storageAvailable=true;
function load(key,fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch(e){storageAvailable=false;return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){storageAvailable=false;showNotice('目前無法永久保存資料，重新整理可能會遺失。')}}
const validFood=f=>f&&typeof f.name==='string'&&f.name.trim()&&CATEGORIES.includes(f.category)&&Number.isSafeInteger(f.price)&&f.price>=0;
let loaded=load(KEY,null);let foods=Array.isArray(loaded)?loaded.filter(validFood).map(f=>({...f,name:f.name.trim()})):DEFAULT_FOODS.map(f=>({...f}));let history=load(HISTORY_KEY,[]);if(!Array.isArray(history))history=[];history=history.filter(h=>h&&typeof h.name==='string'&&typeof h.time==='string').slice(0,5);
let savedFilters=load(FILTER_KEY,{});if(!savedFilters||typeof savedFilters!=='object')savedFilters={};$('filterCategory').value=CATEGORIES.includes(savedFilters.category)?savedFilters.category:'全部';$('filterBudget').value=typeof savedFilters.budget==='string'&&/^\d+$/.test(savedFilters.budget)?savedFilters.budget:'';
let editing=null,spinning=false,angle=0,animationId=null;
function showNotice(t=''){$('notice').textContent=t}
function filtered(){const cat=$('filterCategory').value,b=$('filterBudget').value;return foods.filter(f=>(cat==='全部'||f.category===cat)&&(b===''||f.price<=Number(b)))}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(items=filtered()){const canvas=$('wheel'),ctx=canvas.getContext('2d'),w=800,c=w/2,r=366;ctx.clearRect(0,0,w,w);if(!items.length){ctx.beginPath();ctx.arc(c,c,r,0,2*Math.PI);ctx.fillStyle='#ffedd5';ctx.fill();ctx.fillStyle='#9a3412';ctx.font='bold 37px sans-serif';ctx.textAlign='center';ctx.fillText('沒有符合的食物',c,c);return}const slice=2*Math.PI/items.length;ctx.save();ctx.translate(c,c);ctx.rotate(angle);items.forEach((f,i)=>{const start=-Math.PI/2+i*slice,end=start+slice;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();ctx.strokeStyle='#fff7ed';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate(start+slice/2);ctx.translate(r*.60,0);ctx.rotate(Math.PI/2);ctx.textAlign='center';ctx.fillStyle='#4b2815';ctx.font=`bold ${Math.max(18,Math.min(33,380/items.length))}px sans-serif`;let label=f.name;if(label.length>8)label=label.slice(0,7)+'…';ctx.fillText(label,0,0,Math.min(220,r*.73));ctx.restore()});ctx.beginPath();ctx.arc(0,0,38,0,2*Math.PI);ctx.fillStyle='#fff7ed';ctx.fill();ctx.strokeStyle='#c2410c';ctx.lineWidth=6;ctx.stroke();ctx.fillStyle='#f97316';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,2);ctx.restore()}
function renderList(){const list=$('foodList');list.innerHTML='';$('totalCount').textContent=`共 ${foods.length} 項`;if(!foods.length){list.innerHTML='<div class="empty">清單目前是空的，新增喜歡的食物吧！</div>';return}foods.forEach((f,i)=>{const div=document.createElement('div');div.className='food-item';div.innerHTML=`<div><div class="food-name">${escapeHTML(f.name)}</div><div class="meta">${escapeHTML(f.category)} · NT$${f.price}</div></div><div class="actions"><button class="secondary small" data-edit="${i}" type="button">編輯</button><button class="danger small" data-delete="${i}" type="button">刪除</button></div>`;list.appendChild(div)})}
function renderHistory(){const el=$('history');el.innerHTML='';$('clearHistory').disabled=spinning||history.length===0;if(!history.length){el.innerHTML='<div class="empty">還沒有抽選紀錄，快來試試手氣！</div>';return}const ol=document.createElement('ol');ol.className='history-list';history.forEach(h=>{const li=document.createElement('li');const strong=document.createElement('strong');strong.textContent=h.name;const time=document.createElement('time');time.textContent=h.time;li.append(strong,time);ol.appendChild(li)});el.appendChild(ol)}
function refresh(){const items=filtered();$('foodCount').textContent=`符合 ${items.length} 項`;draw(items);renderList();renderHistory();$('spinBtn').disabled=spinning||items.length===0;if(!spinning&&items.length===0)showNotice('目前沒有符合條件的美食，請調整篩選條件。');else if(!spinning)showNotice(storageAvailable?'':'目前無法永久保存資料，重新整理可能會遺失。')}
function disableDuringSpin(value){spinning=value;document.querySelectorAll('input, select, #foodForm button, #foodList button, #clearHistory, #resetFilters').forEach(el=>el.disabled=value);$('spinBtn').disabled=value||filtered().length===0}
function randomInt(n){if(globalThis.crypto&&crypto.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}
function finish(name){disableDuringSpin(false);$('result').textContent=`🎉 今天就吃：${name}！`;history.unshift({name,time:new Date().toLocaleString('zh-TW',{hour12:false})});history=history.slice(0,5);save(HISTORY_KEY,history);refresh()}
function spin(){const items=filtered();if(spinning||!items.length)return;$('result').textContent='🎡 轉盤旋轉中…';showNotice('');disableDuringSpin(true);const index=randomInt(items.length);if(items.length===1){finish(items[0].name);return}const slice=2*Math.PI/items.length,start=angle,normalized=((start%(2*Math.PI))+2*Math.PI)%(2*Math.PI);const targetNormalized=((2*Math.PI-index*slice-slice/2)%(2*Math.PI))+2*Math.PI;const delta=((targetNormalized-normalized+2*Math.PI)%(2*Math.PI));const end=start+Math.PI*2*7+delta,duration=3900,t0=performance.now();function frame(now){const p=Math.min(1,(now-t0)/duration),e=1-Math.pow(1-p,4);angle=start+(end-start)*e;draw(items);if(p<1)animationId=requestAnimationFrame(frame);else{angle=targetNormalized;draw(items);animationId=null;finish(items[index].name)}}animationId=requestAnimationFrame(frame)}
function resetForm(){editing=null;$('foodForm').reset();$('formTitle').textContent='➕ 新增美食';$('submitFood').textContent='新增到轉盤';$('cancelEdit').hidden=true}
$('foodForm').addEventListener('submit',e=>{e.preventDefault();if(spinning)return;const name=$('foodName').value.trim(),category=$('foodCategory').value,price=Number($('foodPrice').value);if(!name||!CATEGORIES.includes(category)||$('foodPrice').value===''||!Number.isSafeInteger(price)||price<0){alert('請輸入有效食物名稱、類別與非負整數價格。');return}if(foods.some((f,i)=>i!==editing&&f.name===name)){alert('美食清單中已經有相同名稱！');return}const food={name,category,price};if(editing===null)foods.push(food);else foods[editing]=food;save(KEY,foods);resetForm();refresh()});
$('foodList').addEventListener('click',e=>{if(spinning)return;const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const i=Number(edit.dataset.edit),f=foods[i];if(!f)return;editing=i;$('foodName').value=f.name;$('foodCategory').value=f.category;$('foodPrice').value=f.price;$('formTitle').textContent='✏️ 編輯美食';$('submitFood').textContent='儲存修改';$('cancelEdit').hidden=false;$('foodName').focus()}if(del){const i=Number(del.dataset.delete);if(!foods[i]||!confirm(`確定刪除「${foods[i].name}」嗎？`))return;foods.splice(i,1);save(KEY,foods);resetForm();$('result').textContent='';refresh()}});
$('cancelEdit').addEventListener('click',resetForm);
function filtersChanged(){const b=$('filterBudget');if(b.value!==''&&(!/^\d+$/.test(b.value)||!Number.isSafeInteger(Number(b.value)))){b.value='';showNotice('預算請輸入非負整數。')}save(FILTER_KEY,{category:$('filterCategory').value,budget:b.value});$('result').textContent='';refresh()}
$('filterCategory').addEventListener('change',filtersChanged);$('filterBudget').addEventListener('input',filtersChanged);$('resetFilters').addEventListener('click',()=>{$('filterCategory').value='全部';$('filterBudget').value='';filtersChanged()});$('spinBtn').addEventListener('click',spin);$('clearHistory').addEventListener('click',()=>{if(spinning||!history.length)return;if(!confirm('確定清除全部抽選歷史？'))return;history=[];save(HISTORY_KEY,history);renderHistory()});refresh();
})();
</script>
</body></html>
